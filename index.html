<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arena ADA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="barra">
    <a class="marca" href="#/inicio">Arena <b>ADA</b></a>
    <nav class="nav">
      <a href="#/inicio" data-r="inicio">Inicio</a>
      <a href="#/plan" data-r="plan">Plan 21 días</a>
      <a href="#/practica" data-r="practica">Práctica</a>
      <a href="#/competencia" data-r="competencia">Competencia <span id="nav-comp-reloj"></span></a>
      <a href="#/bitacora" data-r="bitacora">Bitácora</a>
      <a href="#/guias" data-r="guias">Guías</a>
      <a href="#/progreso" data-r="progreso">Progreso</a>
    </nav>
    <div class="derecha">
      <span class="racha" title="Días seguidos practicando">🔥 <b id="racha">0</b></span>
      <div class="pomo" id="pomo" title="Pomodoro: 50 min de trabajo, 10 de descanso">
        <span id="pomo-fase">Trabajo</span> <b id="pomo-tiempo">50:00</b>
        <button class="btn mini" id="pomo-btn">Iniciar</button>
        <button class="btn mini sec" id="pomo-reset" title="Reiniciar">↺</button>
      </div>
    </div>
  </header>
  <main id="vista"></main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/selection/active-line.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/guias.js"></script>
  <script src="js/plan.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/judge.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
